# Add binding to reload tmux.conf for fast, iterative development
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Use zsh as default
set -g default-shell /usr/bin/zsh

# True-color support (Kitty understands the real tmux terminfo entry)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# General
set -g set-clipboard on         # Forward copies to the system clipboard via OSC52 (Kitty supports this natively)
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update the status bar every 3 seconds (default: 15 seconds)
set -g allow-passthrough on     # Allow programs in the pane to bypass tmux (e.g. for image preview)

# Set prefix key
unbind C-b              # Unbind the default prefix key
set -g prefix C-Space   # Set new prefix key to Ctrl+Space

# Split using o and e
bind e split-window -hc "#{pane_current_path}"
bind o split-window -vc "#{pane_current_path}"

# Keep current path
bind c new-window -c "#{pane_current_path}"

# Toggle last window
bind Space last-window

# Use vim arrow keys to resize
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi
# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection
# Copy text with "y" -> tmux buffer + system clipboard (via OSC52, no external tool needed)
bind -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer
# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Numbering from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

#################### Plugins ####################

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'
set -g @plugin 'tmux-plugins/tmux-battery'

# Style
# TokyoNight Moon
bg="#222436"
bg_dark="#1E2030"
bg_dark1="#191B29"
bg_highlight="#2F334D"
fg="#C8D3F5"
fg_dark="#828BB8"
fg_gutter="#3B4261"
comment="#636DA6"
blue="#82AAFF"
blue1="#65BCFF"
blue5="#89DDFF"
cyan="#86E1FC"
green="#C3E88D"
yellow="#FFC777"
orange="#FF966C"
red="#FF757F"
purple="#C099FF"

set -g status-position top
set -g status-justify absolute-centre
set -g status-left-length 100
set -g status-right-length 300
set -g status-style "fg=${fg},bg=${bg}"
set -g status-left-style "fg=${fg},bg=${bg}"
set -g status-right-style "fg=${fg},bg=${bg}"
set -g status-left "#[fg=${fg},bold]  #S #[fg=${fg},nobold]"
set -g status-right "#[fg=${fg}] #{cpu} |  #{mem} | 󱊣 #{battery} | #[fg=${fg}]󰸗 %Y-%m-%d 󰥔 %H:%M:%S "
set -g window-status-style "fg=${fg_dark},bg=${bg}"
set -g window-status-format "#[fg=${fg_dark},bg=${bg}] #I:#W"
set -g window-status-current-style "fg=${blue5},bg=${bg_highlight}"
set -g window-status-current-format "#[fg=${blue5},bold,bg=${bg_highlight}]  #I:#W #[fg=${cyan}]#{?window_zoomed_flag,󰍋 ,}"
set -g message-style "fg=${fg},bg=${bg_highlight}"
set -g mode-style "fg=${bg},bg=${blue}"
set -g pane-border-style "fg=${fg_gutter}"
set -g pane-active-border-style "fg=${blue}"

bind S if -F '#{==:#{status-position},top}' \
  'set -g status-position bottom' \
  'set -g status-position top'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/tpm/tpm'
