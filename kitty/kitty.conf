editor nano
allow_remote_control yes
clipboard_max_size 64
allow_hyperlinks yes
shell_integration enabled
enable_audio_bell si
include ~/.config/kitty/kitty-themes/themes/gruvbox_dark.conf

#include color.ini
font_family      JetBrainsMono Nerd Font
font_size 13

disable_ligatures never

url_color #61afef
url_style curly

#: Copy to clipboard
map f1   copy_to_buffer a
map f2   paste_from_buffer a
map f3   copy_to_buffer b
map f4   paste_from_buffer b

cursor_shape beam
cursor_beam_thickness 1.8

mouse_hide_wait 3.0
detect_urls yes

repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+shift+z toggle_layout stack
tab_bar_style powerline

inactive_tab_background #e06c75
active_tab_background #98c379
inactive_tab_foreground #000000
tab_bar_margin_color black

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+left send_text all \x1b[1;5D
map ctrl+right send_text all \x1b[1;5C

background_opacity 0.92

shell /usr/bin/zsh

# --- Splits ---
enabled_layouts splits,stack
map ctrl+alt+j launch --location=vsplit --cwd=current
map ctrl+alt+h launch --location=hsplit --cwd=current
map alt+j next_window
map alt+k previous_window
map alt+w close_window
